<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>회의실 시간표 - 슈어소프트테크</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            text-align: center;
        }

        .card-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: #ffffff;
            padding: 32px 24px;
        }

        .card-header .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-body {
            padding: 36px 28px;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .status-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .status-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .info-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            font-size: 13px;
            color: #334155;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: left;
        }

        .user-tag {
            font-family: monospace;
            background-color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #1e293b;
        }

        .btn-logout {
            display: inline-block;
            padding: 10px 20px;
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <span class="badge">🔐 계정 연결 완료</span>
            <h1>회의실 시간표</h1>
        </div>
        <div class="card-body">
            <div class="icon">📅</div>
            <div class="status-title">계정 연결이 완료되었습니다.</div>
            <p class="status-desc">인증된 사용자: <span class="user-tag">{{ user_display }}</span></p>
            <div class="info-box">
                📌 <strong>안내</strong><br>
                Timeline UI는 다음 단계에서 제공됩니다.<br>
                (회의실 실시간 시간표 그리드 및 예약 조회는 Phase 2.3 제공 예정)
            </div>
            <form method="POST" action="/logout">
                <button type="submit" class="btn-logout">🚪 로그아웃</button>
            </form>
        </div>
    </div>
</body>
</html>
