<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연결 실패 - 회의실 도우미</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 40px 24px;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #991b1b;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .error-message {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .guidance-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            font-size: 13px;
            color: #334155;
            line-height: 1.6;
            text-align: left;
        }

        .guidance-box strong {
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h1>로그인에 실패했습니다</h1>
        <p class="error-message">{{ message }}</p>
        <div class="guidance-box">
            보안을 위해 연결 링크는 1회만 사용 가능합니다.<br>
            Telegram으로 돌아가 <strong>'회사 계정 연결'</strong>을 다시 눌러 새로운 연결 링크를 발급받아 주세요.
        </div>
    </div>
</body>
</html>
